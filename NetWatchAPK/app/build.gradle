plugins {
    id 'com.android.application'
}

android {
    compileSdk 36
    namespace 'com.netwatch.app'

    defaultConfig {
        applicationId "com.netwatch.net"
        minSdk 30
        targetSdk 36
        versionCode 79
        versionName "2.10.1"
    }

    signingConfigs {
        release {
            storeFile file("../netwatch-release.keystore")
            storePassword "NetWatch2026!"
            keyAlias "netwatch-release"
            keyPassword "NetWatch2026!"
        }
    }

    buildTypes {
        debug {
            applicationIdSuffix ""
            debuggable true
            signingConfig signingConfigs.release
        }
        release {
            minifyEnabled true
            shrinkResources true
            debuggable false
            signingConfig signingConfigs.release
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.8.0'
    // Still used for in-app service->UI broadcasts; was previously transitive.
    implementation 'androidx.localbroadcastmanager:localbroadcastmanager:1.1.0'
    implementation 'androidx.activity:activity:1.13.0'
    implementation 'com.google.android.material:material:1.14.0'
    implementation 'androidx.recyclerview:recyclerview:1.4.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.2.2'
}
